<!doctype html>
<html lang="he" dir="rtl" data-mode="dark" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מקום·AI · בדיקת בית ואזור לפי נתוני המדינה</title>
<meta name="description" content="מה יש סביב הכתובת: תכניות בנייה, אנטנות וקרינה, מפעלים מזהמים, פשיעה, בתי ספר ותחבורה. מנתוני המדינה, בחינם.">
<meta name="theme-color" content="#0B0B0D">
<meta property="og:title" content="מקום·AI · בדיקת בית ואזור">
<meta property="og:description" content="מה יש סביב הכתובת לפני שקונים או שוכרים. מנתוני המדינה, בחינם.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== מקום·AI · עיצוב =====================
   ערכות צבע: 5 (משנות רק את צבע ההדגשה) × מצב יום/לילה.
   ערך data-mode הוא בדיוק "dark" / "light" — לקח SkanNest (day≠light).    */
:root{
  --accent:#D4AF37; --accent-2:#E8C964; --on-accent:#0B0B0D;
  --red:#F08A6E; --red-bg:#1A100E; --red-line:#5C2A22;
  --yellow:#D4AF37; --yellow-bg:#15130D; --yellow-line:#4A4128;
  --green:#6FCF97; --green-bg:#0E1712; --green-line:#234A35;
  --blue:#7FB3F0;
  --radius:16px;
}
[data-mode="dark"]{
  --bg:#0B0B0D; --bg-2:#121215; --bg-3:#18181C; --line:#26262C; --line-2:#3A3528;
  --text:#F2EFE6; --text-2:#C9C4B8; --muted:#A7A39A; --faint:#7D7A72;
}
[data-mode="light"]{
  --bg:#F7F5EF; --bg-2:#FFFFFF; --bg-3:#EFECE3; --line:#E2DED2; --line-2:#D9CFAE;
  --text:#1B1A17; --text-2:#3E3B34; --muted:#66625A; --faint:#8A867C;
  --red:#B4432A; --red-bg:#FCEDE8; --red-line:#EAB9AA;
  --yellow:#8A6A0C; --yellow-bg:#FBF4DD; --yellow-line:#E6D49A;
  --green:#1F7A4B; --green-bg:#E7F5EC; --green-line:#A9D8BC;
  --blue:#2F6DB5;
}
[data-theme="gold"]{--accent:#D4AF37;--accent-2:#E8C964;--on-accent:#0B0B0D}
[data-theme="navy"]{--accent:#7FA7E8;--accent-2:#A9C4F0;--on-accent:#0B0B0D}
[data-theme="emerald"]{--accent:#4FC08D;--accent-2:#7DD6AC;--on-accent:#0B0B0D}
[data-theme="ruby"]{--accent:#E07A8A;--accent-2:#EDA3AF;--on-accent:#0B0B0D}
[data-theme="silver"]{--accent:#C2C6CC;--accent-2:#DDE0E4;--on-accent:#0B0B0D}
[data-mode="light"][data-theme="gold"]{--accent:#8A6A0C;--accent-2:#A8820F;--on-accent:#FFFFFF}
[data-mode="light"][data-theme="navy"]{--accent:#2F5DA8;--accent-2:#3C6FC4;--on-accent:#FFFFFF}
[data-mode="light"][data-theme="emerald"]{--accent:#1F7A4B;--accent-2:#278F59;--on-accent:#FFFFFF}
[data-mode="light"][data-theme="ruby"]{--accent:#A93B4C;--accent-2:#C2495C;--on-accent:#FFFFFF}
[data-mode="light"][data-theme="silver"]{--accent:#4D545C;--accent-2:#626A73;--on-accent:#FFFFFF}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Assistant',system-ui,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.display{font-family:'Secular One','Assistant',sans-serif;font-weight:400}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:64px}
.brand{font-family:'Secular One',sans-serif;font-size:22px;flex:1;cursor:default}
.brand b{color:var(--accent);font-weight:400}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:transparent;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 44px}
.ibtn svg{width:20px;height:20px}
.ibtn:active{transform:scale(.96)}

/* ---------- מסכים ---------- */
.screen{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}

/* ---------- בית ---------- */
.hero{padding:28px 0 8px}
.hero h1{margin:0;font-size:34px;line-height:1.15}
.hero p{margin:8px 0 0;color:var(--text-2);font-size:16px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius)}
.search{padding:16px;margin-top:20px;display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 2px 6px}
.field input{width:100%;height:52px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;outline:none}
.field input:focus{border-color:var(--accent)}
.field input:disabled{opacity:.5}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.row2 .field.num{flex:0 0 110px}
.hint{font-size:13px;color:var(--faint);margin:6px 2px 0}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.sec-title{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.3px;margin:26px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-2);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);color:var(--text);background:var(--bg-3)}
.chip .dot{width:9px;height:9px;border-radius:5px}
.what{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.what div{padding:14px;font-size:14px;color:var(--text-2)}
.what b{display:block;color:var(--text);font-size:15px;margin-bottom:2px}

/* ---------- טעינה ---------- */
.loading{padding:40px 0;display:flex;flex-direction:column;gap:12px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;font-size:15px}
.lrow .st{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lrow.ok .st{color:var(--green)} .lrow.err .st{color:var(--red)}

/* ---------- תוצאה: כותרת + מתג תצוגה ---------- */
.addr{padding:20px 0 4px}
.addr .sub{font-size:13px;color:var(--muted);font-weight:700}
.addr h1{margin:4px 0 2px;font-size:32px;line-height:1.1}
.addr .prec{font-size:13px;color:var(--text-2)}
.prec.warn{color:var(--yellow)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--bg-2);border:1px solid var(--line);margin:14px 0 4px}
.seg button{min-height:44px;border:none;border-radius:10px;background:transparent;color:var(--text-2);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg svg{width:18px;height:18px}

/* ---------- תצוגה א: דוח ---------- */
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.count{border-radius:14px;padding:12px 10px;border:1px solid}
.count .n{font-family:'Secular One',sans-serif;font-size:28px;line-height:1}
.count .l{font-size:13px;font-weight:700;margin-top:4px}
.c-red{border-color:var(--red-line);background:var(--red-bg)} .c-red .n{color:var(--red)}
.c-yellow{border-color:var(--yellow-line);background:var(--yellow-bg)} .c-yellow .n{color:var(--yellow)}
.c-green{border-color:var(--green-line);background:var(--green-bg)} .c-green .n{color:var(--green)}
.flag{display:flex;gap:12px;padding:14px;border-radius:var(--radius);border:1px solid;margin-bottom:10px}
.flag.red{border-color:var(--red-line);background:var(--red-bg)}
.flag.yellow{border-color:var(--yellow-line);background:var(--yellow-bg)}
.flag.green{border-color:var(--green-line);background:var(--green-bg)}
.flag.info{border-color:var(--line);background:var(--bg-2)}
.flag .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.flag.red .ic{color:var(--red)} .flag.yellow .ic{color:var(--yellow)} .flag.green .ic{color:var(--green)} .flag.info .ic{color:var(--blue)}
.flag .ic svg{width:22px;height:22px}
.flag .t{font-weight:800;font-size:16px}
.flag .x{font-size:15px;color:var(--text-2);margin-top:3px}
.flag .more{margin:8px 0 0;padding:0;list-style:none;font-size:14px;color:var(--text-2)}
.flag .more li{padding:6px 0;border-top:1px dashed var(--line)}
.flag a.go{display:inline-block;margin-top:6px;font-weight:700;font-size:14px;text-decoration:none}
.cat{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--bg-2)}
.cat > button{width:100%;min-height:64px;display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:none;text-align:right;cursor:pointer}
.cat .sd{width:10px;height:10px;border-radius:5px;flex:0 0 10px}
.cat .ct{flex:1;display:flex;flex-direction:column;gap:2px}
.cat .ct b{font-size:16px}
.cat .ct span{font-size:13px;color:var(--muted)}
.cat .chev{color:var(--faint);transition:transform .15s}
.cat.open .chev{transform:rotate(-90deg)}
.cat .body{display:none;padding:0 12px 12px}
.cat.open .body{display:block}
.todo{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);text-decoration:none;color:var(--text);margin-bottom:8px}
.todo .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);flex:0 0 24px}
.todo .tt{flex:1;display:flex;flex-direction:column}
.todo .tt b{font-size:15px}
.todo .tt span{font-size:13px;color:var(--muted)}
.todo .tag{font-size:13px;color:var(--accent);font-weight:700}

/* ---------- תצוגה ב: מפה ---------- */
#map{height:420px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-top:14px;background:var(--bg-3);z-index:1}
.leaflet-container{font-family:'Assistant',sans-serif}
.near{border-top:1px solid var(--line)}
.near > div{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.near .sd{width:12px;height:12px;border-radius:6px;margin-top:6px;flex:0 0 12px}
.near b{display:block;font-size:15px}
.near span{font-size:14px;color:var(--text-2)}
.near .d{margin-inline-start:auto;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px}

/* ---------- תצוגה ג: סיכום ---------- */
.headline{font-family:'Secular One',sans-serif;font-size:26px;line-height:1.25;margin:16px 0 8px}
.lede{font-size:16px;color:var(--text-2)}
.group{border:1px solid;border-radius:18px;overflow:hidden;margin-top:14px}
.group > .gh{padding:12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;border-bottom:1px solid}
.group > div.it{padding:12px 16px;font-size:15px;border-top:1px solid var(--line)}
.group > div.it:first-of-type{border-top:none}
.g-green{border-color:var(--green-line)} .g-green .gh{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.g-yellow{border-color:var(--yellow-line)} .g-yellow .gh{background:var(--yellow-bg);border-color:var(--yellow-line);color:var(--yellow)}
.g-red{border-color:var(--red-line)} .g-red .gh{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.gh svg{width:20px;height:20px}

/* ---------- כללי ---------- */
.foot{font-size:12px;color:var(--faint);margin:28px 0 8px;line-height:1.6}
.badge{display:block;text-align:center;font-size:12px;color:var(--faint);margin:10px 0 40px;text-decoration:none}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.list-item:last-child{border-bottom:none}
.list-item .tt{flex:1}
.list-item .tt b{display:block;font-size:15px}
.list-item .tt span{font-size:13px;color:var(--muted)}
.empty{padding:16px;color:var(--muted);font-size:14px}
.err{padding:16px;border-radius:14px;border:1px solid var(--red-line);background:var(--red-bg);color:var(--text);margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:999;max-width:90vw}

/* ---------- חלונות ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px 16px 28px}
.modal h2{margin:4px 0 14px;font-family:'Secular One',sans-serif;font-weight:400;font-size:24px}
.set-row{padding:14px 0;border-bottom:1px solid var(--line)}
.set-row > label,.set-row > .lb{display:block;font-weight:800;margin-bottom:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--text)}
.guide-step{text-align:center;padding:12px 6px}
.guide-step .gi{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--accent);display:flex;align-items:center;justify-content:center}
.guide-step .gi svg{width:30px;height:30px}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots span{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots span.on{background:var(--accent);width:20px}

/* ---------- הדפסה ---------- */
@media print{
  .topbar,.seg,.actions,.no-print,#map,.badge{display:none!important}
  body{background:#fff;color:#000}
  .cat .body{display:block!important}
  .print-head{display:block!important}
}
.print-head{display:none;font-size:12px;margin:10px 0}
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="wrap">
    <button class="ibtn hidden" id="btnBack" aria-label="חזרה לדף הבית" data-icon="back"></button>
    <div class="brand">מקום<b>·AI</b></div>
    <button class="ibtn" id="btnMode" aria-label="מצב יום/לילה" data-icon="moon"></button>
    <button class="ibtn" id="btnSettings" aria-label="הגדרות" data-icon="gear"></button>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* =====================================================================
   מקום·AI  ·  גרסה 1.0.0  ·  AppNest · Barak Aflalo · © 2026
   קובץ אחד. אין שרת: כל המקורות נענים ישירות מהדפדפן (אומת 8.10.2026
   מתוך makom-ai.pages.dev). מקורות: data.gov.il (רישיון פתוח),
   מינהל התכנון (iplan Xplan), OpenStreetMap Nominatim (איתור כתובת).
   נתוני nadlan.gov.il לא בשימוש עד אישור בכתב ממפ"י (תנאי השימוש שלהם).
   ===================================================================== */
const VERSION = '1.0.1';

/* ---------- יומן שגיאות (לקח StockAI) ---------- */
const ERRLOG_KEY = 'makom_errlog';
function logErr(msg, src, line) {
  try {
    const a = JSON.parse(localStorage.getItem(ERRLOG_KEY) || '[]');
    a.unshift({ m: String(msg).slice(0, 300), s: src || '', l: line || '', t: new Date().toISOString() });
    localStorage.setItem(ERRLOG_KEY, JSON.stringify(a.slice(0, 10)));
  } catch (e) {}
}
window.addEventListener('error', e => logErr(e.message, e.filename, e.lineno));
window.addEventListener('unhandledrejection', e => logErr(e.reason && (e.reason.message || e.reason)));

/* ---------- אחסון (עטיפה עם נפילה לזיכרון) ---------- */
const store = (() => {
  const mem = {};
  return {
    get(k, d) { try { const v = localStorage.getItem('makom_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return k in mem ? mem[k] : d; } },
    set(k, v) { try { localStorage.setItem('makom_' + k, JSON.stringify(v)); return true; } catch (e) { mem[k] = v; toast('השמירה במכשיר נכשלה'); return false; } },
    del(k) { try { localStorage.removeItem('makom_' + k); } catch (e) {} delete mem[k]; }
  };
})();

/* ---------- אייקונים (קו, בלי אימוג'י) ---------- */
const ICONS = {
  back: '<path d="M9 6l6 6-6 6"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plan: '<path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>',
  antenna: '<path d="M12 13v8"/><circle cx="12" cy="11" r="2"/><path d="M8.5 7.5a5 5 0 0 0 0 7M15.5 7.5a5 5 0 0 1 0 7M5.6 4.6a9 9 0 0 0 0 12.8M18.4 4.6a9 9 0 0 1 0 12.8"/>',
  factory: '<path d="M3 21V10l6 4V10l6 4V6h6v15z"/><path d="M7 17h2M12 17h2M17 17h2"/>',

/* מטמון: Cache API עם תוקף (cache-first, לקח Winner). כשל לעולם לא נשמר. */
async function cachedJSON(url, ttl) {
  let cache = null;
  try { cache = await caches.open('makom-data-v1'); } catch (e) {}
  if (cache) {
    try {
      const hit = await cache.match(url);
      if (hit) {
        const at = Number(hit.headers.get('x-at') || 0);
        if (Date.now() - at < ttl) return await hit.json();
      }
    } catch (e) {}
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const txt = await r.text();
  const j = JSON.parse(txt);
  if (cache && j && j.success !== false) {
    try { await cache.put(url, new Response(txt, { headers: { 'content-type': 'application/json', 'x-at': String(Date.now()) } })); } catch (e) {}
  }
  return j;
}
function ckUrl(rid, o = {}) {
  const p = new URLSearchParams({ resource_id: rid, limit: String(o.limit ?? 100) });
  if (o.fields) p.set('fields', o.fields.join(','));
  if (o.filters) p.set('filters', JSON.stringify(o.filters));
  if (o.q) p.set('q', o.q);
  if (o.sort) p.set('sort', o.sort);
  return CK + '?' + p.toString();
}
async function ck(rid, o, ttl = DAY) {
  const j = await cachedJSON(ckUrl(rid, o), ttl);
  if (!j || !j.result) throw new Error('תשובה לא תקינה');
  return j.result;
}
const norm = s => String(s || '').replace(/[\s\-–־'"״׳()]/g, '').replace(/יי/g, 'י').replace(/וו/g, 'ו');

/* ---------- איתור כתובת (Nominatim, עם בדיקת עיר — לקח: "הרצל 10 חיפה" חזר בחדרה) ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function nom(params) {
  const p = new URLSearchParams({ format: 'json', countrycodes: 'il', addressdetails: '1', limit: '6', 'accept-language': 'he', ...params });
  const r = await fetch(NOMINATIM + '?' + p.toString());
  if (!r.ok) throw new Error('איתור הכתובת נכשל (' + r.status + ')');
  return r.json();
}
/* בדיקת עיר: רק מול שם היישוב עצמו. לא מול הכתובת המלאה —
   בכתובת של חדרה כתוב "מחוז חיפה", וזה העביר את חדרה כ"חיפה" (באג שנתפס בבדיקה 8.10.2026). */
function placeCities(a) { const ad = a.address || {}; return [ad.city, ad.town, ad.village, ad.municipality, ad.hamlet].filter(Boolean); }
function cityMatch(res, city) {
  const c = norm(city);
  return res.filter(a => placeCities(a).some(n => { const pc = norm(n); return pc && pc.length > 1 && (pc === c || pc.startsWith(c) || c.startsWith(pc)); }));
}
async function geocode(city, street, num) {
  // 1) כתובת מלאה, מובנית
  if (street) {
    const r1 = cityMatch(await nom({ street: (num ? num + ' ' : '') + street, city }), city);
    const exact = r1.find(a => num && a.address && String(a.address.house_number || '') === String(num));
    if (exact) return { lat: +exact.lat, lon: +exact.lon, precision: 'house' };
    const onStreet = r1.find(a => a.address && norm(a.address.road).includes(norm(street)));
    if (onStreet) return { lat: +onStreet.lat, lon: +onStreet.lon, precision: num ? 'street' : 'street' };
    await sleep(1100); // מדיניות Nominatim: בקשה אחת לשנייה
    const r2 = cityMatch(await nom({ q: street + ', ' + city }), city);
    if (r2[0]) return { lat: +r2[0].lat, lon: +r2[0].lon, precision: 'street' };
    await sleep(1100);
  }
  // 2) מרכז היישוב
  const r3 = cityMatch(await nom({ city }), city);
  const pick = r3[0] || (await nom({ q: city }))[0];
  if (pick) return { lat: +pick.lat, lon: +pick.lon, precision: 'city' };
  throw new Error('לא הצלחנו לאתר את הכתובת על המפה');
}

/* מוסדות חינוך: מיקום מ"קואורדינטות מוסדות החינוך", וסוג/פיקוח ממאגר "מאפייני מוסדות"
   לפי סמל מוסד (שמות הגנים לרוב לא מתחילים ב"גן" — "נירית", "זית" — לכן לא מסווגים לפי שם).

const PIKUACH = s => { const t = String(s || '').replace(/["'״]/g, ''); return /^ממד$/.test(t) ? 'ממלכתי-דתי' : /^ממ$/.test(t) ? 'ממלכתי' : /חרד|עצמא|מעיין/.test(t) ? 'חרדי' : t; };
async function getSchools(p) {
  const r = await ck(RID.schools, { limit: 32000, fields: ['SEMEL_MOSAD', 'SHEM_MOSAD', 'ITM_X', 'ITM_Y'] }, 30 * DAY);
  const near = r.records.map(s => ({ id: Number(s.SEMEL_MOSAD), name: String(s.SHEM_MOSAD || '').trim(), xy: [Number(s.ITM_X), Number(s.ITM_Y)] }))
    .filter(s => validITM(...s.xy)).map(s => ({ ...s, d: dist(p, s.xy) })).filter(s => s.d <= 1500).sort((a, b) => a.d - b.d)
    .filter((s, i, arr) => arr.findIndex(o => o.name === s.name && Math.abs(o.xy[0] - s.xy[0]) < 30 && Math.abs(o.xy[1] - s.xy[1]) < 30) === i) // כפילויות: אותו שם באותה נקודה
    .slice(0, 150);
  const info = {};
  try {
    const ids = near.map(s => s.id).filter(Boolean);
    if (ids.length) {
      const j = await ck(RID.schoolInfo, { limit: 1500, sort: 'שנה desc', fields: ['סמל מוסד', 'שנה', 'סוג מוסד', 'פיקוח', 'מגזר', 'משכבה', 'עד שכבה'], filters: { 'סמל מוסד': ids } }, 30 * DAY);
      for (const x of j.records) if (!info[x['סמל מוסד']]) info[x['סמל מוסד']] = x;
    }
  } catch (e) { logErr('schoolInfo: ' + e.message); }
  return near.map(s => {
    const x = info[s.id];
    let kind = 'other';
    if (x) {
      const from = Number(x['משכבה']), to = Number(x['עד שכבה']), type = String(x['סוג מוסד'] || '');
      if (/גן ילדים/.test(type) || (to === 0 && from === 0)) kind = 'kg';
      else if (to >= 1 && to <= 6) kind = 'elem';
      else if (from >= 7 && to <= 9) kind = 'junior';
      else if (from >= 7 || to >= 10) kind = 'high';
      else if (to >= 1) kind = 'elem';
    }
    return { ...s, kind, kg: kind === 'kg', pik: x ? PIKUACH(x['פיקוח']) : '', sector: x ? x['מגזר'] : '' };
  });
}

async function getSafety(city, street) {
  const F = ['send_date', 'work_name', 'city_name', 'executor_name', 'category_name', 'felony_name'];
  let r = await ck(RID.safety, { limit: 5000, fields: F, filters: { city_name: city } }, DAY);
  const c = norm(city);
  if (!r.records.length) { r = await ck(RID.safety, { limit: 5000, fields: F, q: city }, DAY); r.records = r.records.filter(x => norm(x.city_name) === c); }
  const yearAgo = Date.now() - 365 * DAY;
  const parseD = s => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || ''); return m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : 0; };
  const rows = r.records.filter(x => /בני/.test(x.category_name || '')).map(x => ({ ...x, t: parseD(x.send_date) }));
  const recent = rows.filter(x => x.t >= yearAgo).sort((a, b) => b.t - a.t);
  const onStreet = street ? recent.filter(x => norm(x.work_name).includes(norm(street))) : [];
  return { recent, onStreet };
}

  const prev = await ck(rid0, { limit: 0, filters: { YeshuvKod: code } }, 30 * DAY);

      id, name: name.trim(), num: a['מספר תכנית'], type: a['תת-סוג תכנית'], status, stage,
      approved: /אישור/.test(status) && /אושרה|פרסום אישור/.test(stage),
      dunam: Number(a['שטח תכנית רשום בדונם'] || 0),
      units: Number(a["שינוי מס' יח' דיור "] || a["שינוי מס' יח' דיור"] || 0),
      goal: goal.replace(/\s+/g, ' ').trim(),
      updated: a['תאריך עדכון אחרון'], published: a['תאריך פרסום ברשומות'],
      link: a['קישור לאתר מידע תכנוני']
    });
  }
  return out;
}

/* ---------- תאריך מ-M/D/YYYY (פורמט של iplan) ---------- */
function usDate(s) { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || ''); return m ? `${m[2].padStart(2, '0')}/${m[1].padStart(2, '0')}/${m[3]}` : (s || ''); }
function yearOf(s) { const m = /(\d{4})/.exec(s || ''); return m ? Number(m[1]) : 0; }

/* =====================================================================
   ניתוח: כל שכבה הופכת לממצא אחד או יותר, במשפט ברור.
   חומרה: red = לבדוק · yellow = לשים לב · green = בסדר · info = מידע
   הכללים כאן, גלויים — כדי שיהיה ברור איך הגענו לכל דגל (לקח LexCalendar).
   ===================================================================== */
const CATS = {
  plan: { t: 'תכנון ובנייה', ic: 'plan' }, env: { t: 'סביבה ובריאות', ic: 'factory' },
  safe: { t: 'ביטחון אישי', ic: 'shield' }, edu: { t: 'חינוך', ic: 'school' },
  move: { t: 'תחבורה', ic: 'bus' }, build: { t: 'בטיחות בנייה', ic: 'hardhat' }
};
function analyze(R) {
  const F = [];
  const add = f => F.push(f);
  const has = k => R[k] && !R[k].error;

  // ---- תכנון ----
  if (has('plans')) {
    const local = R.plans.filter(p => p.dunam > 0 && p.dunam <= 500);
    const wide = R.plans.filter(p => !(p.dunam > 0 && p.dunam <= 500));
    const localPending = local.filter(p => !p.approved);
    const widePending = wide.filter(p => !p.approved);
    for (const p of localPending) add({ cat: 'plan', sev: 'red', ic: 'plan', title: 'תכנית בנייה בתהליך, חלה ממש כאן',
      text: `${p.name}. סטטוס: ${p.status || 'לא צוין'}.${p.units ? ` משנה ${fmtN(p.units)} יחידות דיור.` : ''}${p.goal ? ' ' + p.goal.slice(0, 160) : ''}`,
      link: p.link && { href: p.link, label: 'מסמכי התכנית במינהל התכנון' } });
    for (const p of local.filter(p => p.approved)) add({ cat: 'plan', sev: 'info', ic: 'plan', title: 'תכנית מאושרת שחלה על המקום',
      text: `${p.name}${p.published ? ` · פורסמה ${usDate(p.published)}` : ''}.${p.goal ? ' ' + p.goal.slice(0, 140) : ''}`, link: p.link && { href: p.link, label: 'פרטי התכנית' } });
    for (const p of widePending) add({ cat: 'plan', sev: 'yellow', ic: 'plan', title: p.dunam && p.dunam < 5000 ? 'תכנית לאזור בתהליך' : 'תכנית כלל-עירונית בתהליך',
      text: `${p.name}. סטטוס: ${p.status || 'לא צוין'}.${p.units ? ` כוללת שינוי של ${fmtN(p.units)} יחידות דיור בעיר.` : ''}`, link: p.link && { href: p.link, label: 'פרטי התכנית' } });
    if (!R.plans.length) add({ cat: 'plan', sev: 'green', ic: 'plan', title: 'אין תכניות מקוונות בנקודה', text: 'במאגר המקוון של מינהל התכנון (תכניות מ-2011 ואילך) לא נמצאה תכנית החלה על הנקודה. תכניות ישנות יותר לא מופיעות כאן.' });
    else if (!local.length && !widePending.length) add({ cat: 'plan', sev: 'green', ic: 'plan', title: 'רק תכניות כלל-עירוניות מאושרות', text: `${R.plans.length} תכניות מאושרות חלות על כל העיר (למשל ${R.plans[0].name}). לא נמצאה תכנית מקומית בתהליך.` });
  }

  // ---- אנטנות ----
  if (has('antennas')) {
    const A = R.antennas, near100 = A.filter(a => a.d <= 100), in300 = A.filter(a => a.d <= 300), in500 = A.filter(a => a.d <= 500);
    const noPermit = in300.filter(a => a.permit && !/יש היתר/.test(a.permit));
    const n = A[0];
    const maxPct = in500.reduce((m, a) => Math.max(m, isFinite(a.pct) ? a.pct : 0), 0);
    const oldest = in500.map(a => yearOf(a.check)).filter(Boolean).sort()[0];
    const base = n ? `הקרובה: ${n.co || ''}, ${n.addr || ''} (${fmtM(n.d)}).${isFinite(n.pct) && n.pct > 0 ? ` בבדיקה האחרונה (${n.check || 'ללא תאריך'}) נמדדו ${n.pct}% מסף הבריאות.` : ''}` : '';
    if (noPermit.length) add({ cat: 'env', sev: 'red', ic: 'antenna', title: `${noPermit.length} אנטנות בלי היתר קרינה בטווח 300 מ'`, text: base, markers: 'antennas' });
    else if (near100.length) add({ cat: 'env', sev: 'yellow', ic: 'antenna', title: `אנטנה במרחק ${fmtM(near100[0].d)} מהבית`, text: base + (oldest && oldest < new Date().getFullYear() - 3 ? ` חלק מהבדיקות הרשמיות ישנות (${oldest}).` : ''), markers: 'antennas' });
    else if (in500.length) add({ cat: 'env', sev: 'green', ic: 'antenna', title: `${in500.length} אנטנות ברדיוס 500 מ'`, text: base + (maxPct ? ` הערך הגבוה ביותר שנמדד ביניהן: ${maxPct}% מהסף.` : ''), markers: 'antennas' });
    else add({ cat: 'env', sev: 'green', ic: 'antenna', title: "אין אנטנות ברדיוס 500 מ'", text: A.length ? `הקרובה במרחק ${fmtM(A[0].d)}.` : 'לא נמצאו אנטנות בקילומטר הקרוב.' });
  }

  // ---- מפעלים ----
  if (has('factories')) {
    const P = R.factories, in1 = P.filter(f => f.d <= 1000), in3 = P.filter(f => f.d <= 3000);
    const desc = f => `${f.name}${f.field ? ` (${f.field})` : ''}, ${fmtM(f.d)}`;
    if (in1.length) add({ cat: 'env', sev: 'red', ic: 'factory', title: `${in1.length} מפעלים המדווחים על פליטות בטווח 1 ק"מ`, text: in1.slice(0, 3).map(desc).join(' · ') + '.', markers: 'factories' });
    else if (in3.length) add({ cat: 'env', sev: 'yellow', ic: 'factory', title: `${in3.length} מפעלים מדווחים בטווח 3 ק"מ`, text: 'הקרוב: ' + desc(in3[0]) + '.', markers: 'factories' });
    else add({ cat: 'env', sev: 'green', ic: 'factory', title: 'אין מפעלים מדווחים בטווח 3 ק"מ', text: P.length ? `הקרוב: ${desc(P[0])}.` : 'לא נמצא מפעל מדווח (מפל"ס) בטווח 5 ק"מ.' });
  }

  // ---- תחנת ניטור אוויר ----
  if (has('air') && R.air.length) {
    const a = R.air[0];
    add({ cat: 'env', sev: 'info', ic: 'air', title: 'תחנת ניטור אוויר קרובה', text: `${a.name}${a.city ? ', ' + a.city : ''} · ${fmtM(a.d)}.${a.polls ? ' מודדת: ' + String(a.polls).slice(0, 80) + '.' : ''}`, link: { href: 'https://air.sviva.gov.il/', label: 'איכות האוויר עכשיו' } });
  }

  // ---- דלק ----
  if (has('gas') && R.gas.length && R.gas[0].d <= 150) {
    const g = R.gas[0];
    add({ cat: 'env', sev: 'yellow', ic: 'fuel', title: `תחנת דלק במרחק ${fmtM(g.d)}`, text: `${g.co || ''} ${g.name || ''}${g.addr ? ', ' + g.addr : ''}. קרבה לתחנת דלק עלולה להשפיע על ריח, רעש ותנועה.`, markers: 'gas' });
  }

  // ---- פשיעה ----
  if (has('crime') && R.crime.total) {
    const c = R.crime, partial = c.quarters.length < 4;
    const top = c.groups.slice(0, 3).map(([g, n]) => `${g} (${fmtN(n)})`).join(', ');
    let sev = 'info', title = `${fmtN(c.total)} תיקים נפתחו ב-${c.year}`;
    let text = `ביישוב כולו. הנפוצים: ${top}.`;
    if (!partial && c.prevTotal) {
      const ch = (c.total - c.prevTotal) / c.prevTotal * 100;
      title += `, ${ch < 0 ? 'ירידה' : 'עלייה'} של ${Math.abs(ch).toFixed(1)}%`;
      sev = ch <= -3 ? 'green' : ch >= 5 ? 'yellow' : 'info';
      text += ` ב-${c.prevYear} נפתחו ${fmtN(c.prevTotal)}.`;
    } else if (partial) text += ` נתוני ${c.year} חלקיים (${c.quarters.join(', ')}).`;
    text += ' זה מספר כולל ליישוב, לא לפי תושב.';
    add({ cat: 'safe', sev, ic: 'shield', title, text, more: c.areas.slice(0, 6).map(([a, n]) => `${a}: ${fmtN(n)} תיקים`), moreTitle: 'לפי אזור סטטיסטי' });
  }

  // ---- בטיחות בנייה ----
  if (has('safety')) {
    const s = R.safety;
    if (s.onStreet.length) add({ cat: 'build', sev: 'red', ic: 'hardhat', title: `צו בטיחות לאתר בנייה ברחוב ${R.addr.street}`, text: s.onStreet.slice(0, 2).map(x => `${x.work_name} · ${x.executor_name || ''} · ${x.felony_name || ''} (${x.send_date})`).join(' | ') });
    if (s.recent.length) add({ cat: 'build', sev: 'info', ic: 'hardhat', title: `${s.recent.length} צווי בטיחות לאתרי בנייה ביישוב בשנה האחרונה`, text: 'צווים שהוציא משרד העבודה לאתרים עם ליקויי בטיחות. שימושי לבדיקת קבלן לפני שקונים מקבלן.', more: s.recent.slice(0, 6).map(x => `${x.send_date} · ${x.work_name} · ${x.executor_name || ''}`), moreTitle: 'האחרונים' });
  }

  // ---- חינוך ----
  if (has('schools')) {
    const S = R.schools;
    const kg = S.filter(s => s.kind === 'kg' && s.d <= 500), el = S.filter(s => s.kind === 'elem' && s.d <= 1000), hi = S.filter(s => (s.kind === 'high' || s.kind === 'junior') && s.d <= 1500);
    const near = k => S.find(s => s.kind === k);
    const w = s => s ? `${s.name}${s.pik ? ', ' + s.pik : ''} (${fmtM(s.d)})` : '';
    const ne = near('elem'), nk = near('kg'), nh = S.find(s => s.kind === 'high' || s.kind === 'junior');
    const pikSet = [...new Set(el.map(s => s.pik).filter(Boolean))];
    const other = S.filter(s => s.kind === 'other' && s.d <= 1000).length;
    add({ cat: 'edu', sev: el.length && kg.length ? 'green' : 'yellow', ic: 'school',
      title: `${kg.length} גנים ב-500 מ', ${el.length} יסודיים בק"מ, ${hi.length} על-יסודיים${other ? ` ועוד ${other} מוסדות` : ''}`,
      text: [ne && `היסודי הקרוב: ${w(ne)}`, nk && `הגן הקרוב: ${w(nk)}`, nh && `העל-יסודי הקרוב: ${w(nh)}`].filter(Boolean).join('. ') + '.' +
        (pikSet.length ? ` סוגי פיקוח ביסודיים הקרובים: ${pikSet.join(', ')}.` : '') + ' (סיווג המוסדות לפי משרד החינוך, עדכון אחרון 2015.)', markers: 'schools' });
  }

  // ---- תחבורה ----
  if (has('bus')) {
    const B = R.bus, in400 = B.filter(b => b.d <= 400);
    add({ cat: 'move', sev: in400.length >= 3 ? 'green' : in400.length ? 'info' : 'yellow', ic: 'bus',
      title: in400.length ? `${in400.length} תחנות תחבורה ציבורית ב-400 מ'` : "אין תחנת תחבורה ציבורית ב-400 מ'",
      text: B.length ? `הקרובה במרחק ${fmtM(B[0].d)}.` : 'לא נמצאה תחנה ביישוב בטווח 800 מ\'.', markers: 'bus' });
  }
  return F;
}

const STEPS = [
  ['plans', 'תכניות בנייה (מינהל התכנון)'], ['antennas', 'אנטנות ומדידות קרינה'], ['factories', 'מפעלים מזהמים (מפל"ס)'],
  ['crime', 'נתוני משטרה'], ['schools', 'מוסדות חינוך'], ['bus', 'תחבורה ציבורית'], ['air', 'תחנות ניטור אוויר'],
  ['gas', 'תחנות דלק'], ['safety', 'צווי בטיחות באתרי בנייה']
];
let CURRENT = null;
async function runCheck(addr) {
  setScreen('loading');
  const box = document.getElementById('lsteps');
  const mark = (k, ok, msg) => { const el = document.getElementById('ls-' + k); if (!el) return; el.className = 'lrow card ' + (ok ? 'ok' : 'err'); el.querySelector('.st').innerHTML = icon(ok ? 'check' : 'x', 18); if (msg) el.querySelector('.m').textContent = msg; };
  box.innerHTML = `<div class="lrow card" id="ls-geo"><span class="st"><span class="spin"></span></span><span class="m">מאתר את הכתובת על המפה</span></div>` +
    STEPS.map(([k, t]) => `<div class="lrow card" id="ls-${k}"><span class="st"><span class="spin"></span></span><span class="m">${t}</span></div>`).join('');
  let geo;
  try { await ensureLibs(); geo = await geocode(addr.city, addr.street, addr.num); mark('geo', true); }
  catch (e) { mark('geo', false, 'איתור הכתובת נכשל: ' + e.message); showError('לא הצלחנו לאתר את הכתובת. בדוק את שם הרחוב ונסה שוב.'); return; }
  const p = toITM(geo.lat, geo.lon);
  const R = { addr, geo, p, at: new Date().toISOString() };
  const jobs = {
    plans: () => getPlans(geo.lat, geo.lon), antennas: () => getAntennas(p), factories: () => getFactories(p),
    crime: () => getCrime(addr.code), schools: () => getSchools(p), bus: () => getBus(p, addr.code),
    air: () => getAir(p), gas: () => getGas(p), safety: () => getSafety(addr.city, addr.street)
  };
  await Promise.all(Object.entries(jobs).map(async ([k, fn]) => {
    try { R[k] = await fn(); mark(k, true); }
    catch (e) { R[k] = { error: e.message }; logErr(k + ': ' + e.message); mark(k, false, STEPS.find(s => s[0] === k)[1] + ' · לא זמין כרגע'); }
  }));
  R.findings = analyze(R);
  CURRENT = R;
  addRecent(addr);
  renderResult();
}

const label = a => [a.street, a.num].filter(Boolean).join(' ') + (a.street ? ', ' : '') + a.city;
async function initSearch() {
  const iCity = document.getElementById('iCity'), iStreet = document.getElementById('iStreet'), iNum = document.getElementById('iNum');

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportJSON() { download('makom-ai-backup.json', JSON.stringify({ app: 'מקום·AI', version: VERSION, user: store.get('user', ''), date: new Date().toISOString(), saved: store.get('saved', []), recent: store.get('recent', []), settings: { theme: store.get('theme', 'gold'), mode: store.get('mode', 'dark'), defaultView: store.get('defaultView', 'report') } }, null, 2), 'application/json'); }
function exportCSV() { const rows = [['יישוב', 'רחוב', 'מספר'], ...store.get('saved', []).map(a => [a.city, a.street || '', a.num || ''])]; download('makom-ai-saved.csv', '﻿' + `# ${store.get('user', '')} · ${new Date().toLocaleDateString('he-IL')}\n` + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv'); }
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const j = JSON.parse(t); if (!confirm('השחזור יחליף את הכתובות השמורות וההגדרות. להמשיך?')) return;
    store.set('saved', j.saved || []); store.set('recent', j.recent || []); if (j.user) store.set('user', j.user);
    if (j.settings) { store.set('theme', j.settings.theme || 'gold'); store.set('mode', j.settings.mode || 'dark'); store.set('defaultView', j.settings.defaultView || 'report'); }
    applyLook(); toast('הגיבוי שוחזר'); setScreen('home'); }).catch(() => toast('קובץ הגיבוי לא תקין'));
}
function openAbout() {
  let errs = []; try { errs = JSON.parse(localStorage.getItem(ERRLOG_KEY) || '[]'); } catch (e) {}
  const m = modal(`<h2>אודות מקום·AI</h2>
  <p style="color:var(--text-2)">בדיקת בית ואזור לפי נתוני המדינה: מה מתוכנן לקום ליד הכתובת, אנטנות ומדידות קרינה, מפעלים מזהמים, פשיעה, חינוך ותחבורה.</p>
  <div class="card" style="padding:14px;font-size:14px;line-height:1.9">גרסה ${VERSION}<br>פותח על ידי Barak Aflalo<br>פלטפורמה: PWA · HTML5<br>אחסון: על המכשיר בלבד<br>© AppNest 2026</div>
  <p style="font-size:14px;color:var(--text-2)">הנתונים נשאבים ממאגרים פתוחים של המדינה ומוצגים כפי שהם. הם עשויים להיות חלקיים או לא מעודכנים. האפליקציה אינה ייעוץ משפטי, שמאי או הנדסי, ולפני כל עסקה יש לאמת מול הגורם המוסמך.</p>
  <div class="chips"><a class="chip" href="https://appnest-store.pages.dev" target="_blank" rel="noopener">חנות AppNest</a><button class="chip" id="aShare">שתף את האפליקציה</button><a class="chip" href="mailto:appnest55@gmail.com?subject=${encodeURIComponent('משוב על מקום·AI')}">שלח משוב</a><a class="chip" href="privacy_policy.html" target="_blank">מדיניות פרטיות</a></div>
  <details style="margin-top:16px"><summary style="cursor:pointer;color:var(--muted)">דוח אבחון</summary><pre style="white-space:pre-wrap;font-size:12px;color:var(--muted)">גרסה ${VERSION} · ${esc(navigator.userAgent)}\n${errs.length ? errs.map(e => `${e.t} · ${esc(e.m)}`).join('\n') : 'אין שגיאות רשומות'}</pre></details>
  <button class="btn primary block" id="aClose" style="margin-top:18px">סגור</button>`);
  m.querySelector('#aClose').onclick = () => m.remove();
  m.querySelector('#aShare').onclick = async () => { const u = location.origin + location.pathname; if (navigator.share) { try { await navigator.share({ title: 'מקום·AI', text: 'בדיקת בית ואזור לפי נתוני המדינה', url: u }); } catch (e) {} } else { try { await navigator.clipboard.writeText(u); toast('הקישור הועתק'); } catch (e) {} } };
}
const GUIDE = [
  ['pin', 'בוחרים כתובת', 'מתחילים להקליד יישוב ובוחרים מהרשימה, אחר כך רחוב. מספר בית לא חובה, אבל משפר את הדיוק.'],
  ['search', 'בודקים', 'האפליקציה שואלת בבת אחת את מאגרי המדינה: תכנון, סביבה, משטרה, חינוך ותחבורה.'],
  ['list', 'שלוש תצוגות', 'דוח עם דגלים, מפה של מה שמסביב, או סיכום במילים. עוברים ביניהן בלחיצה.'],
  ['alert', 'אדום, צהוב, ירוק', 'אדום = לבדוק לפני שמתקדמים. צהוב = לשים לב. ירוק = בסדר. כל דגל מסביר למה.'],
  ['check', 'לפני שחותמים', 'בסוף כל בדיקה יש רשימת בדיקות עם קישורים: נסח טאבו, מסמכי תכנית, עסקאות באזור.']
];
function openGuide() {
  let i = 0;
  const m = modal('<div id="gBody"></div>');
  const draw = () => {
    const [ic, t, x] = GUIDE[i];
    m.querySelector('#gBody').innerHTML = `<div class="guide-step"><div class="gi">${icon(ic)}</div><h2>${t}</h2><p style="color:var(--text-2)">${x}</p></div>
    <div class="dots">${GUIDE.map((_, j) => `<span class="${j === i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="actions"><button class="btn" id="gSkip">${i === GUIDE.length - 1 ? 'סגור' : 'דלג'}</button><button class="btn primary" id="gNext">${i === GUIDE.length - 1 ? 'מתחילים' : 'הבא'}</button></div>`;
    m.querySelector('#gSkip').onclick = done; m.querySelector('#gNext').onclick = () => { if (i < GUIDE.length - 1) { i++; draw(); } else done(); };
  };
  const done = () => { store.set('guideSeen', true); m.remove(); };
  draw();
}

/* =====================================================================
   אתחול
   ===================================================================== */
document.querySelectorAll('[data-icon]').forEach(b => b.innerHTML = icon(b.dataset.icon));
document.getElementById('btnBack').onclick = () => { history.replaceState(null, '', location.pathname); setScreen('home'); };
document.getElementById('btnSettings').onclick = openSettings;
document.getElementById('btnMode').onclick = () => { store.set('mode', store.get('mode', 'dark') === 'dark' ? 'light' : 'dark'); applyLook(); if (screen === 'result' && document.getElementById('map')) drawView('map'); };
applyLook();
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('c') && q.get('city')) go({ city: q.get('city'), code: Number(q.get('c')), street: q.get('s') || '', num: q.get('n') || '' });
  else setScreen('home');
  if (!store.get('guideSeen', false)) setTimeout(openGuide, 400);
})();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => logErr('sw: ' + e.message));
if (location.protocol === 'file:') setTimeout(() => toast('נפתח מקובץ מקומי: חלק מהיכולות לא יעבדו. פתחו מ-makom-ai.pages.dev'), 800);
</script>
